# Déploiement automatique : GitHub (branche main) -> build -> hébergement LWS (FTP) -> davycas.com
#
# Secrets GitHub (Settings > Secrets and variables > Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   accès FTP LWS
#   FTP_DIR        (facultatif) dossier du site sur le serveur, terminé par / (par défaut ./htdocs/)
#   FTP_PROTOCOL   (facultatif) ftps (par défaut) ou ftp

name: Déploiement LWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le site
        run: npm run build

      - name: Envoyer le site sur LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ secrets.FTP_DIR || secrets.FTP_SERVER_DIR || './htdocs/' }}
          local-dir: ./dist/
