# Déploiement automatique : GitHub (branche main) -> hébergement LWS (FTP) -> davycas.com
#
# Secrets à créer dans GitHub : Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER     : serveur FTP donné par LWS (ex. ftp.davycas.com)
#   FTP_USERNAME   : identifiant FTP LWS
#   FTP_PASSWORD   : mot de passe FTP LWS
# Secrets facultatifs :
#   FTP_DIR        : dossier du site sur le serveur, terminé par / (par défaut ./htdocs/)
#   FTP_PROTOCOL   : ftps (par défaut) ou ftp si LWS refuse la connexion chiffrée

name: Déploiement LWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Envoyer le site sur LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ secrets.FTP_DIR || secrets.FTP_SERVER_DIR || './htdocs/' }}
          # Fichiers internes qui ne doivent pas être publiés
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            **/.DS_Store
            qa/**
            docs/**
            *.py
            *.md
