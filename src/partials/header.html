<header class="site-header" data-header>
  <div class="site-header__inner wrap">
    <a class="site-header__logo" href="/" aria-label="DAVYCAS International, accueil">
      <img class="logo logo--dark" src="/assets/logo-davycas.png" alt="" width="627" height="160">
      <img class="logo logo--light" src="/assets/logo-davycas-blanc.png" alt="" width="627" height="160">
    </a>
    <nav class="site-nav" id="menu" aria-label="Navigation principale">
      <ul class="site-nav__list">
        {{#each nav}}<li><a class="site-nav__link" href="{{.url}}" data-nav="{{.key}}">{{.label}}</a></li>{{/each}}
      </ul>
      <a class="btn btn--primary site-nav__cta" href="/agir/">Agir avec nous</a>
    </nav>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" data-menu-toggle>
      <span class="menu-toggle__label">Menu</span>
      <span class="menu-toggle__bars" aria-hidden="true"><span></span><span></span></span>
    </button>
  </div>
</header>
