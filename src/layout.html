<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{canonical}}">
  {{robots}}
  <meta name="theme-color" content="#020566">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="DAVYCAS International">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  {{preload}}
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="/assets/js/main.js" defer></script>
  {{ld}}
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  {{> header}}
  <main id="contenu" tabindex="-1">
    {{breadcrumb}}
    {{content}}
  </main>
  {{> footer}}
  <a class="donate-bar" href="/agir/#soutenir">Soutenir nos actions</a>
</body>
</html>
